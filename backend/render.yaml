# render.yaml
services:
  - type: web
    name: home-services-backend
    env: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /me
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: myapp-db
          property: connectionString
      - key: SECRET_KEY
        value: ${SECRET_KEY}
      - key: RAZORPAY_KEY_ID
        value: ${RAZORPAY_KEY_ID}
      - key: RAZORPAY_KEY_SECRET
        value: ${RAZORPAY_KEY_SECRET}
      - key: CLOUDINARY_URL
        value: ${CLOUDINARY_URL}
